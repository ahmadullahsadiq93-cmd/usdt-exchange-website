<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
  body{background:#0f172a;color:#e2e8f0;padding:14px}
  .wrap{max-width:800px;margin:0 auto}
  .card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:14px}
  h1{font-size:18px;margin-bottom:10px}
  h2{font-size:13px;color:#94a3b8;margin:14px 0 8px;text-transform:uppercase}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px}
  .field input{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}
  .btn{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600;color:#fff;font-size:13px;margin-top:6px}
  .btn-primary{background:#10b981}.btn-blue{background:#3b82f6}.btn-red{background:#ef4444}
  .btn-ghost{background:transparent;color:#94a3b8;margin:0}
  .order{background:#0f172a;border-radius:10px;padding:12px;margin-bottom:10px;border-left:4px solid #3b82f6}
  .row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;gap:8px}
  .row strong{color:#94a3b8;font-weight:500;flex-shrink:0}
  .row span{word-break:break-all;text-align:right}
  .status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;background:#f59e0b}
  .st-Completed{background:#3b82f6}.st-Rejected{background:#ef4444}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin:10px 0}
  .msg.error{background:#7f1d1d;color:#fecaca}.msg.ok{background:#14532d;color:#bbf7d0}
</style>
</head>
<body><div class="wrap"><div id="app"></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);
const S = { user:null, view:'loading', settings:{}, orders:[] };
const $ = id => document.getElementById(id);
const showMsg = (id, t, isErr) => { const el=$(id); if(el) el.innerHTML=`<div class="msg ${isErr?'error':'ok'}">${t}</div>`; };

 async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ S.view='login'; render(); return; }
  S.user = session.user;
  
  // د نوي فنکشن کارول ترڅو امنیتي ستونزه حل شي
  const { data: isAdmin, error } = await db.rpc('check_is_admin');
  
  if(error) {
    alert("Database Error: " + error.message); // که ستونزه وه، به یې راته ووایي
    return;
  }
  
  if(!isAdmin){ 
    S.view='denied'; render(); return; 
  }
  
  await loadAll();
  S.view='dashboard'; render();
}

async function loadAll(){
  const { data:sd, error:se } = await db.from('settings').select('*');
  if(se){ alert('Settings load error: '+se.message); return; }
  S.settings = Object.fromEntries((sd||[]).map(r=>[r.key,r.value]));
  const { data:od } = await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
  S.orders = od || [];
}

function render(){
  const a=$('app');
  if(S.view==='loading') a.innerHTML='<div class="card">Loading...</div>';
  else if(S.view==='login') a.innerHTML=viewLogin();
  else if(S.view==='denied') a.innerHTML=viewDenied();
  else if(S.view==='dashboard') a.innerHTML=viewDash();
}

function viewLogin(){
  return `<div class="card"><h1>Admin Login</h1>
    <div class="field"><label>Email</label><input id="f_email" type="email"></div>
    <div class="field"><label>Password</label><input id="f_pass" type="password"></div>
    <div id="msg"></div>
    <button class="btn btn-primary" onclick="doLogin()">Login</button></div>`;
}

function viewDenied(){
  return `<div class="card"><h1>Access Denied</h1>
    <p style="color:#94a3b8;font-size:13px;margin-top:8px">This account is not admin.</p>
    <button class="btn btn-ghost" onclick="doLogout()" style="margin-top:12px">Logout</button></div>`;
}

function viewDash(){
  const s=S.settings;
  return `<div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <h1>Admin Dashboard</h1><button class="btn btn-ghost" onclick="doLogout()">Logout</button></div>
    <div class="card"><h2>Daily Settings — Rate & Fee</h2>
    <div class="grid">
      <div class="field"><label>Rate (AFN/USDT)</label><input id="s_rate" type="number" step="0.01" value="${s.rate||''}"></div>
      <div class="field"><label>Fee %</label><input id="s_fee" type="number" step="0.1" value="${s.fee_percent||''}"></div>
      <div class="field"><label>Hesab Pay #</label><input id="s_hp" value="${s.hesabpay_number||''}"></div>
      <div class="field"><label>MTN MoMo #</label><input id="s_momo" value="${s.momo_number||''}"></div>
      <div class="field"><label>TRC20 Wallet</label><input id="s_trc" value="${s.wallet_trc20||''}"></div>
      <div class="field"><label>BEP20 Wallet</label><input id="s_bep" value="${s.wallet_bep20||''}"></div>
      <div class="field"><label>ERC20 Wallet</label><input id="s_erc" value="${s.wallet_erc20||''}"></div>
      <div class="field"><label>Holder Name</label><input id="s_holder" value="${s.account_holder||''}"></div>
      <div class="field"><label>Support Channel Link</label><input id="s_channel" value="${s.help_channel||''}" placeholder="https://t.me/..."></div>
<div class="field"><label>WhatsApp Number</label><input id="s_wa" value="${s.help_whatsapp||''}" placeholder="93700000000"></div>
<div class="field"><label>Telegram Username</label><input id="s_tg" value="${s.help_telegram||''}" placeholder="@username"></div>
    </div>
    <div class="card"><h2>📢 Send Announcement to Users</h2>
  <div class="field"><label>Message Title</label><input id="n_title" placeholder="e.g., New Rate Update!"></div>
  <div class="field"><label>Message Body</label><input id="n_msg" placeholder="Write your message here..."></div>
  <button class="btn btn-blue" onclick="sendNotification()">Send Message</button>
  <div id="notifMsg"></div>
</div>
    <div id="settingsMsg"></div>
    <button class="btn btn-primary" onclick="saveSettings()">Save All Settings</button></div>
    <div class="card"><h2>Orders (${S.orders.length})</h2>
    ${S.orders.length ? S.orders.map(viewOrder).join('') : '<p style="color:#94a3b8;font-size:13px">No orders yet</p>'}</div>`;
}

function viewOrder(o){
  const stCls = o.status==='Payment Submitted'?'':o.status;
  return `<div class="order">
    <div class="row"><strong>${o.order_type}</strong><span class="status ${stCls?'st-'+stCls:''}">${o.status}</span></div>
    <div class="row"><strong>Amount</strong><span>${o.amount_input} ${o.currency_input}</span></div>
    <div class="row"><strong>Total</strong><span>${o.total_amount}</span></div>
    ${o.wallet_address?`<div class="row"><strong>Wallet</strong><span>${o.wallet_address}</span></div>`:''}
    ${o.mobile_number?`<div class="row"><strong>Mobile</strong><span>${o.mobile_network} ${o.mobile_number}</span></div>`:''}
    <div class="row"><strong>TXID</strong><span>${o.txid||'-'}</span></div>
    ${o.screenshot_url?`<div class="row"><strong>Proof</strong><button class="btn btn-blue" style="padding:4px 8px;font-size:11px;margin:0" onclick="viewShot('${o.screenshot_url}')">View</button></div>`:''}
    <div class="actions">
      ${o.status!=='Completed'?`<button class="btn btn-primary" onclick="setStatus('${o.id}','Completed')">Complete</button>`:''}
      ${o.status!=='Rejected'?`<button class="btn btn-red" onclick="setStatus('${o.id}','Rejected')">Reject</button>`:''}
    </div></div>`;
}

async function doLogin(){
  const email=$('f_email').value.trim(), pass=$('f_pass').value;
  if(!email||!pass){ showMsg('msg','Enter email and password',true); return; }
  const { error } = await db.auth.signInWithPassword({email,password:pass});
  if(error){ showMsg('msg',error.message,true); return; }
  await boot();
}

async function doLogout(){ await db.auth.signOut(); location.reload(); }

async function saveSettings(){
  const map=[
  ['rate','s_rate'],['fee_percent','s_fee'],
  ['hesabpay_number','s_hp'],['momo_number','s_momo'],
  ['wallet_trc20','s_trc'],['wallet_bep20','s_bep'],
  ['wallet_erc20','s_erc'],['account_holder','s_holder'],
  ['help_channel','s_channel'],['help_whatsapp','s_wa'],['help_telegram','s_tg']
];
  for(const[key,inputId]of map){
    const newVal=$(inputId).value.trim(), oldVal=S.settings[key]||'';
    if(newVal===oldVal) continue;
    const { error } = await db.from('settings').upsert({key,value:newVal,updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error){ showMsg('settingsMsg',`Failed ${key}: ${error.message}`,true); return; }
    await db.from('settings_history').insert({setting_key:key,old_value:oldVal,new_value:newVal,changed_by:S.user.id});
  }
  showMsg('settingsMsg','Settings saved!',false);
  await loadAll(); render();
}
async function sendNotification() {
  const title = $('n_title').value.trim();
  const msg = $('n_msg').value.trim();
  if(!title || !msg) { showMsg('notifMsg', 'Please fill both title and message', true); return; }
  
  const { error } = await db.from('notifications').insert({ title, message: msg });
  if(error) { showMsg('notifMsg', error.message, true); return; }
  
  showMsg('notifMsg', '✅ Message sent successfully!', false);
  $('n_title').value = ''; $('n_msg').value = '';
     }
async function setStatus(id,status){
  if(!confirm(`Set order to ${status}?`)) return;
  const upd={status};
  if(status==='Completed') upd.completed_at=new Date().toISOString();
  const { error } = await db.from('orders').update(upd).eq('id',id);
  if(error){ alert('Error: '+error.message); return; }
  await loadAll(); render();
}

async function viewShot(path){
  const { data, error } = await db.storage.from('screenshots').createSignedUrl(path,300);
  if(error){ alert(error.message); return; }
  window.open(data.signedUrl,'_blank');
}

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel - USDT Exchange</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{background:#0f172a;color:#e2e8f0;padding:16px;min-height:100vh;}
  .wrap{max-width:800px;margin:0 auto}
  
  /* Header */
  .admin-header { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: 20px; padding: 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); border: 1px solid #334155; position: relative; overflow: hidden;}
  .admin-header::after { content: '🛡️'; position: absolute; right: -10px; bottom: -20px; font-size: 100px; opacity: 0.05; }
  .admin-header h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff;}
  .admin-header p { font-size: 13px; color: #94a3b8; margin-top: 6px; font-weight: 600; }
  
  /* Tabs */
  .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
  .tabs-nav::-webkit-scrollbar { display: none; }
  .tab-btn { flex: 1; padding: 14px 20px; border: 1px solid #334155; border-radius: 14px; background: #1e293b; color: #94a3b8; font-weight: 700; cursor: pointer; font-size: 14px; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative;}
  .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
  
  /* Cards */
  .card { background: #1e293b; border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 1px solid #334155; }
  .card h2 { font-size: 18px; font-weight: 800; color: #f8fafc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; padding-bottom: 14px; }
  
  /* Forms */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
  .field input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 15px; outline: none; transition: 0.2s; }
  .field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  
  /* Buttons */
  .btn { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; color: #fff; font-size: 14px; margin-top: 8px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #10b981; box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
  .btn-primary:hover { background: #059669; }
  .btn-blue { background: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.2); }
  .btn-blue:hover { background: #2563eb; }
  .btn-red { background: #ef4444; box-shadow: 0 4px 12px rgba(239,68,68,0.2); }
  .btn-red:hover { background: #dc2626; }
  .btn-dark { background: #334155; color: #e2e8f0; }
  .btn-dark:hover { background: #475569; }
  .btn-outline { background: rgba(255,255,255,0.05); border: 1px solid #475569; color: #cbd5e1; box-shadow: none; }
  
  /* Orders */
  .order { background: #0f172a; border-radius: 14px; padding: 18px; margin-bottom: 14px; border-left: 4px solid #f59e0b; border-top: 1px solid #334155; border-right: 1px solid #334155; border-bottom: 1px solid #334155; }
  .order.completed { border-left-color: #10b981; opacity: 0.8; }
  .order.rejected { border-left-color: #ef4444; opacity: 0.8; }
  
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; gap: 10px; border-bottom: 1px dashed #334155; }
  .row:last-child { border-bottom: none; }
  .row strong { color: #94a3b8; font-weight: 600; flex-shrink: 0; }
  .row span { word-break: break-all; text-align: right; color: #f8fafc; font-weight: 600; }
  
  .status { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; background: #fef3c7; color: #b45309; }
  .st-Completed { background: rgba(16,185,129,0.2); color: #34d399; }
  .st-Rejected { background: rgba(239,68,68,0.2); color: #f87171; }
  
  /* Sub Tabs for Orders */
  .order-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
  .order-tab { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; font-weight: 700; cursor: pointer; position: relative;}
  .order-tab.active { background: #334155; color: #fff; border-color: #475569; }
  .badge { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 10px; box-shadow: 0 2px 5px rgba(239,68,68,0.5);}
  
  /* Messages */
  .msg-item { background: #0f172a; border-radius: 14px; padding: 18px; margin-bottom: 14px; border: 1px solid #334155; border-left: 4px solid #3b82f6; }
  .msg { padding: 14px 16px; border-radius: 12px; font-size: 14px; margin: 12px 0; font-weight: 600; }
  .msg.error { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .msg.ok { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }

  .login-wrapper { max-width: 400px; margin: 50px auto; text-align: center; }
  .login-icon { font-size: 60px; margin-bottom: 15px; }
  .login-title { font-size: 26px; font-weight: 800; color: #f8fafc; margin-bottom: 20px;}

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .tabs-nav { padding-bottom: 10px; }
    .admin-header { flex-direction: column; align-items: flex-start; gap: 15px;}
  }
</style>
</head>
<body><div class="wrap"><div id="app"></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script>
const db = supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);
// د S په متغیر کې موږ orderTab اضافه کړ چې کنټرول کړو کوم ټب ښکاره شي (new یا history)
const S = { user:null, view:'loading', settings:{}, orders:[], searchUser:null, searchOrders:[], searchId:'', adminTab: 'settings', orderTab: 'new', notifications: [] };
const $ = id => document.getElementById(id);
const showMsg = (id, t, isErr) => { const el=$(id); if(el) el.innerHTML=`<div class="msg ${isErr?'error':'ok'}">${t}</div>`; };

async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ S.view='login'; render(); return; }
  S.user = session.user;
  const { data: isAdmin, error } = await db.rpc('check_is_admin');
  if(error) { alert("Database Error: " + error.message); return; }
  if(!isAdmin){ S.view='denied'; render(); return; }
  await loadAll();
  S.view='dashboard'; render();
}

async function loadAll(){
  const { data:sd, error:se } = await db.from('settings').select('*');
  if(se){ alert('Settings load error: '+se.message); return; }
  S.settings = Object.fromEntries((sd||[]).map(r=>[r.key,r.value]));
  
  const { data:od } = await db.from('orders').select('*').order('created_at',{ascending:false}).limit(300);
  S.orders = od || [];

  const { data:notifData } = await db.from('notifications').select('*').order('created_at',{ascending:false});
  S.notifications = notifData || [];
}

function render(){
  const a=$('app');
  if(S.view==='loading') a.innerHTML='<div class="card" style="text-align:center;padding:40px;">⏳ Loading Admin Panel...</div>';
  else if(S.view==='login') a.innerHTML=viewLogin();
  else if(S.view==='denied') a.innerHTML=viewDenied();
  else if(S.view==='dashboard') a.innerHTML=viewDash();
}

function viewLogin(){
  return `<div class="login-wrapper">
    <div class="login-icon">🛡️</div>
    <h1 class="login-title">Admin Login</h1>
    <div class="card" style="text-align:left;">
      <div class="field"><label>Email Address</label><input id="f_email" type="email" placeholder="admin@example.com"></div>
      <div class="field"><label>Password</label><input id="f_pass" type="password" placeholder="••••••••"></div>
      <div id="msg"></div>
      <button class="btn btn-blue" style="width:100%; margin-top:15px;" onclick="doLogin()">🔓 Login to Dashboard</button>
    </div>
  </div>`;
}

function viewDenied(){
  return `<div class="card" style="text-align:center; margin-top:50px;">
    <div style="font-size:60px; margin-bottom:10px;">⛔</div>
    <h1 style="color:#ef4444; font-size:22px;">Access Denied</h1>
    <p style="color:#94a3b8;font-size:14px;margin-top:8px">This account does not have administrator privileges.</p>
    <button class="btn btn-dark" onclick="doLogout()" style="margin-top:20px; width:100%;">Logout</button>
  </div>`;
}

function viewDash(){
  // د نویو امرونو شمېرل ترڅو بیج پرې وښیو
  const newOrdersCount = S.orders.filter(o => o.status === 'Payment Submitted').length;

  return `<div class="admin-header">
    <div>
      <h1>🛡️ Admin Dashboard</h1>
      <p>Manage your exchange platform</p>
    </div>
    <button class="btn btn-outline" onclick="doLogout()">🚪 Logout</button>
  </div>
  
  <div class="tabs-nav">
    <button class="tab-btn ${S.adminTab==='settings'?'active':''}" onclick="S.adminTab='settings'; render()">⚙️ Settings</button>
    <button class="tab-btn ${S.adminTab==='orders'?'active':''}" onclick="S.adminTab='orders'; render()">
      📦 Orders 
      ${newOrdersCount > 0 && S.adminTab !== 'orders' ? `<span class="badge" style="top:5px; right:5px;">${newOrdersCount}</span>` : ''}
    </button>
    <button class="tab-btn ${S.adminTab==='announcement'?'active':''}" onclick="S.adminTab='announcement'; render()">📢 Message</button>
    <button class="tab-btn ${S.adminTab==='users'?'active':''}" onclick="S.adminTab='users'; render()">👥 Users</button>
  </div>

  ${S.adminTab==='settings' ? viewAdminSettings() : ''}
  ${S.adminTab==='orders' ? viewAdminOrders() : ''}
  ${S.adminTab==='announcement' ? viewAdminAnnouncement() : ''}
  ${S.adminTab==='users' ? viewAdminUsers() : ''}
  `;
}

function viewAdminSettings(){
  const s=S.settings;
  return `<div class="card"><h2>💰 Buy USDT Rate & Fee</h2>
    <div class="grid">
      <div class="field"><label>BUY USDT Rate (AFN per $1)</label><input id="s_rate_usdt" type="number" step="0.01" value="${s.rate_usdt||'64'}"></div>
      <div class="field"><label>BUY USDT Fee (%)</label><input id="s_fee_usdt" type="number" step="0.1" value="${s.fee_usdt||'3'}"></div>
    </div>
  </div>

  <div class="card"><h2>💵 Buy AFN Rate & Fee</h2>
    <div class="grid">
      <div class="field"><label>BUY AFN Rate ($ per 1 AFN)</label><input id="s_rate_afn" type="number" step="0.0001" value="${s.rate_afn||'0.0154'}"></div>
      <div class="field"><label>BUY AFN Fee (%)</label><input id="s_fee_afn" type="number" step="0.1" value="${s.fee_afn||'3'}"></div>
    </div>
  </div>

  <div class="card"><h2>📱 Mobile Topup Rate & Fee</h2>
    <div class="grid">
      <div class="field"><label>Topup Rate (AFN per $1)</label><input id="s_rate_topup" type="number" step="0.01" value="${s.rate_topup||'66'}"></div>
      <div class="field"><label>Topup Fee (%)</label><input id="s_fee_topup" type="number" step="0.1" value="${s.fee_topup||'3'}"></div>
    </div>
  </div>

  <div class="card"><h2>🎁 Referral Settings</h2>
    <div class="grid">
      <div class="field"><label style="color:#10b981;">Referral Comm. (%)</label><input id="s_ref" type="number" step="0.1" value="${s.referral_percent||'1'}"></div>
    </div>
  </div>

  <div class="card"><h2>💳 Payment Details</h2>
    <div class="grid">
      <div class="field"><label>Hesab Pay #</label><input id="s_hp" value="${s.hesabpay_number||''}"></div>
      <div class="field"><label>MTN MoMo #</label><input id="s_momo" value="${s.momo_number||''}"></div>
      <div class="field"><label>TRC20 Wallet</label><input id="s_trc" value="${s.wallet_trc20||''}"></div>
      <div class="field"><label>BEP20 Wallet</label><input id="s_bep" value="${s.wallet_bep20||''}"></div>
      <div class="field"><label>ERC20 Wallet</label><input id="s_erc" value="${s.wallet_erc20||''}"></div>
      <div class="field"><label>Account Holder Name</label><input id="s_holder" value="${s.account_holder||''}"></div>
    </div>
  </div>

  <div class="card"><h2>💬 Support Links</h2>
    <div class="grid">
      <div class="field"><label>Official Channel Link</label><input id="s_channel" value="${s.help_channel||''}" placeholder="https://t.me/..."></div>
      <div class="field"><label>WhatsApp Number</label><input id="s_wa" value="${s.help_whatsapp||''}" placeholder="93700000000"></div>
      <div class="field"><label>Telegram Username</label><input id="s_tg" value="${s.help_telegram||''}" placeholder="@username"></div>
    </div>
  </div>

  <div id="settingsMsg"></div>
  <button class="btn btn-primary" style="width:100%; padding:18px; font-size:16px;" onclick="saveSettings()">💾 Save All Settings</button>`;
}

function viewAdminOrders() {
  // دلته امرونه جلا کوو
  const newOrders = S.orders.filter(o => o.status === 'Payment Submitted');
  const oldOrders = S.orders.filter(o => o.status !== 'Payment Submitted');
  
  // کوم ټب چې فعال دی هغه ښیو
  const displayOrders = S.orderTab === 'new' ? newOrders : oldOrders;

  return `<div class="card">
    <h2 style="justify-content:space-between; border-bottom:none; margin-bottom:0; padding-bottom:0;">
      <span>📦 Orders</span>
      <button class="btn btn-dark" style="padding:8px 14px; margin:0; font-size:13px;" onclick="refreshOrders()">🔄 Refresh</button>
    </h2>
    
    <div class="order-tabs" style="margin-top:20px;">
      <button class="order-tab ${S.orderTab==='new'?'active':''}" onclick="S.orderTab='new'; render()">
        🔔 New Orders
        ${newOrders.length > 0 ? `<span class="badge">${newOrders.length}</span>` : ''}
      </button>
      <button class="order-tab ${S.orderTab==='history'?'active':''}" onclick="S.orderTab='history'; render()">
        📜 Old Orders (${oldOrders.length})
      </button>
    </div>

    <div style="margin-top:20px;">
      ${displayOrders.length ? displayOrders.map(viewOrder).join('') : `<p style="color:#94a3b8;font-size:14px;text-align:center;padding:30px;">No ${S.orderTab} orders found.</p>`}
    </div>
  </div>`;
}

function viewAdminAnnouncement(){
  return `<div class="card">
    <h2>📢 Send Announcement</h2>
    <p style="font-size:14px; color:#94a3b8; margin-bottom:16px; font-weight:600;">This message will be sent to all users instantly.</p>
    <div class="field"><label>Message Title</label><input id="n_title" placeholder="e.g., New Rate Update!"></div>
    <div class="field"><label>Message Body</label><input id="n_msg" placeholder="Write your message here..."></div>
    <button class="btn btn-blue" style="width:100%" onclick="sendNotification()">🚀 Send Message</button>
    <div id="notifMsg"></div>
  </div>

  <div class="card">
    <h2>📜 Sent History</h2>
    ${S.notifications.length ? S.notifications.map(n => `
      <div class="msg-item">
        <div style="font-weight:800; color:#f8fafc; font-size:16px; margin-bottom:6px;">${n.title}</div>
        <div style="font-size:14px; color:#cbd5e1; margin-bottom:12px; line-height:1.6;">${n.message}</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; color:#64748b; font-weight:600;">📅 ${new Date(n.created_at).toLocaleString()}</span>
          <button class="btn btn-red" style="padding:8px 14px; margin:0; font-size:12px;" onclick="deleteNotification('${n.id}')">🗑️ Delete for All</button>
        </div>
      </div>
    `).join('') : '<p style="color:#94a3b8;font-size:14px;text-align:center;padding:20px;">No messages sent yet.</p>'}
  </div>`;
}

function viewAdminUsers() {
  return `<div class="card">
    <h2>🔍 Find User Account</h2>
    <div class="field">
      <div style="display:flex; gap:12px">
        <input id="s_user_id" value="${S.searchId || ''}" placeholder="Enter User ID (e.g., A-1234)">
        <button class="btn btn-blue" style="margin-top:0; white-space:nowrap" onclick="searchUser()">Search</button>
      </div>
    </div>
    
    ${S.searchUser ? `
      <div style="background:#0f172a; border:1px solid #334155; padding:20px; border-radius:16px; margin-top:24px;">
        <div class="row"><strong>Name</strong><span>${S.searchUser.full_name || 'N/A'}</span></div>
        <div class="row"><strong>User ID</strong><span style="color:#10b981">${S.searchUser.user_code}</span></div>
        <div class="row"><strong>Email</strong><span>${S.searchUser.email || S.searchUser.user_email || 'N/A'}</span></div>
        <div class="row"><strong>Balance</strong><span style="color:#3b82f6">${S.searchUser.balance || 0} USDT</span></div>
        
        <div style="margin-top:24px; border-top:1px solid #334155; padding-top:20px;">
          <h3 style="font-size:14px; color:#94a3b8; margin-bottom:16px; font-weight:800;">UPDATE CREDENTIALS</h3>
          <div class="field"><label>New Email</label><input id="u_email" value="${S.searchUser.email || ''}"></div>
          <div class="field"><label>New Password</label><input id="u_pass" type="text" placeholder="Leave empty to keep current"></div>
          <button class="btn btn-primary" style="width:100%" onclick="updateUserAuth('${S.searchUser.id}')">Update Email & Password</button>
        </div>
      </div>
      
      <h2 style="margin-top:30px; border-bottom:none; padding-bottom:0;">User Order History</h2>
      <div style="margin-top:16px;">
        ${S.searchOrders.length ? S.searchOrders.map(viewOrder).join('') : '<p style="color:#94a3b8;font-size:14px;text-align:center;padding:20px;">No orders found for this user.</p>'}
      </div>
    ` : ''}
  </div>`;
}

async function refreshOrders() { await loadAll(); render(); }

async function searchUser() {
  const code = $('s_user_id').value.trim();
  if(!code) return;
  S.searchId = code;
  const { data: profile, error } = await db.from('profiles').select('*').eq('user_code', code).single();
  if(error || !profile) { alert('User not found! Please check the ID.'); S.searchUser = null; S.searchOrders = []; render(); return; }
  S.searchUser = profile;
  const { data: orders } = await db.from('orders').select('*').eq('user_id', profile.id).order('created_at', {ascending:false});
  S.searchOrders = orders || [];
  render();
}

async function updateUserAuth(userId) {
  const newEmail = $('u_email').value.trim();
  const newPass = $('u_pass').value.trim();
  if (!newEmail && !newPass) { alert('Please enter a new email or password to update.'); return; }
  if(!confirm("Are you sure you want to update this user's credentials?")) return;
  const { error } = await db.rpc('admin_update_user_auth', { new_email: newEmail, new_password: newPass, target_user_id: userId });
  if(error) { alert('Error updating user: ' + error.message); return; }
  alert('✅ User credentials updated successfully!');
  S.searchUser.email = newEmail; render();
}

function viewOrder(o){
  let statusClass = 'pending';
  if (o.status === 'Completed') statusClass = 'completed';
  if (o.status === 'Rejected') statusClass = 'rejected';
  
  const isProcessed = (o.status === 'Completed' || o.status === 'Rejected');
  
  let icon = '💵';
  if(o.order_type === 'BUY_USDT') icon = '🪙';
  else if(o.order_type === 'BUY_AFN') icon = '💵';
  else if(o.order_type === 'TOPUP') icon = '📱';

  return `<div class="order ${statusClass}">
    <div class="row" style="align-items:center; margin-bottom:8px; border-bottom:none;">
      <strong style="font-size:16px; color:#f8fafc;">${icon} ${o.order_type}</strong>
      <span class="status st-${o.status==='Completed'?'Completed':o.status==='Rejected'?'Rejected':''}">${o.status}</span>
    </div>
    <div class="row"><strong>Amount</strong><span>${o.amount_input} ${o.currency_input}</span></div>
    <div class="row"><strong>Total</strong><span>${o.total_amount}</span></div>
    <div class="row"><strong>Fee</strong><span>${o.fee_amount||0}</span></div>
    ${o.wallet_address?`<div class="row"><strong>Wallet</strong><span>${o.wallet_address}</span></div>`:''}
    ${o.mobile_number?`<div class="row"><strong>Mobile</strong><span>${o.mobile_network} ${o.mobile_number}</span></div>`:''}
    <div class="row"><strong>TXID</strong><span>${o.txid||'-'}</span></div>
    ${o.screenshot_url?`<div class="row"><strong>Proof</strong><button class="btn btn-dark" style="padding:6px 12px;font-size:12px;margin:0;" onclick="viewShot('${o.screenshot_url}')">📸 View Receipt</button></div>`:''}
    
    <div style="display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap;">
      ${isProcessed 
        ? `<div style="width:100%; text-align:center; color:#10b981; font-weight:800; font-size:14px; padding:12px; background:#0f172a; border-radius:12px; border:1px solid #334155;">✅ Processed & Locked</div>` 
        : `
          <button class="btn btn-primary" style="flex:1;" onclick="setStatus('${o.id}','Completed')">Complete</button>
          <button class="btn btn-red" style="flex:1;" onclick="setStatus('${o.id}','Rejected')">Reject</button>
        `
      }
    </div>
  </div>`;
}

async function doLogin(){
  const email=$('f_email').value.trim(), pass=$('f_pass').value;
  if(!email||!pass){ showMsg('msg','Enter email and password',true); return; }
  const { error } = await db.auth.signInWithPassword({email,password:pass});
  if(error){ showMsg('msg',error.message,true); return; }
  await boot();
}
async function doLogout(){ await db.auth.signOut(); location.reload(); }

async function saveSettings(){
  const map=[
    ['rate_usdt','s_rate_usdt'], ['fee_usdt','s_fee_usdt'],
    ['rate_afn','s_rate_afn'], ['fee_afn','s_fee_afn'],
    ['rate_topup','s_rate_topup'], ['fee_topup','s_fee_topup'],
    ['referral_percent','s_ref'],
    ['hesabpay_number','s_hp'],['momo_number','s_momo'],
    ['wallet_trc20','s_trc'],['wallet_bep20','s_bep'],
    ['wallet_erc20','s_erc'],['account_holder','s_holder'],
    ['help_channel','s_channel'],['help_whatsapp','s_wa'],['help_telegram','s_tg']
  ];
  for(const[key,inputId]of map){
    const newVal=$(inputId).value.trim(), oldVal=S.settings[key]||'';
    if(newVal===oldVal) continue;
    const { error } = await db.from('settings').upsert({key,value:newVal,updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error){ showMsg('settingsMsg',`Failed ${key}: ${error.message}`,true); return; }
  }
  showMsg('settingsMsg','Settings saved successfully!',false);
  await loadAll(); render();
}

async function sendNotification() {
  const title = $('n_title').value.trim(), msg = $('n_msg').value.trim();
  if(!title || !msg) { showMsg('notifMsg', 'Please fill both title and message', true); return; }
  const { error } = await db.from('notifications').insert({ title, message: msg });
  if(error) { showMsg('notifMsg', error.message, true); return; }
  showMsg('notifMsg', '✅ Message sent successfully!', false);
  $('n_title').value = ''; $('n_msg').value = '';
  await loadAll(); render();
}

async function deleteNotification(id) {
  if(!confirm("ایا تاسو ډاډه یاست چې غواړئ دا پیغام د ټولو کاروونکو لپاره حذف کړئ؟")) return;
  const { error } = await db.from('notifications').delete().eq('id', id);
  if(error) { alert('Error deleting message: ' + error.message); return; }
  alert('✅ Message deleted for all users successfully!');
  await loadAll(); render();
}

async function setStatus(id, status){
  let order = S.orders.find(o => o.id === id);
  if (!order && S.searchOrders) order = S.searchOrders.find(o => o.id === id);
  
  if (order && (order.status === 'Completed' || order.status === 'Rejected')) {
    alert('❌ This order is already processed and cannot be changed.');
    return;
  }

  if(!confirm(`Set order to ${status}?`)) return;
  const upd={status};
  if(status==='Completed') upd.completed_at=new Date().toISOString();
  
  const { error } = await db.from('orders').update(upd).eq('id',id);
  if(error){ alert('Error: '+error.message); return; }

  if(status === 'Completed') {
    if (order) {
      const { data: buyerProfile } = await db.from('profiles').select('referred_by').eq('id', order.user_id).single();
      if (buyerProfile && buyerProfile.referred_by) {
        const refPercent = parseFloat(S.settings.referral_percent || '0');
        if (refPercent > 0) {
          const feeAmount = parseFloat(order.fee_amount || '0');
          const commission = feeAmount * (refPercent / 100);
          if (commission > 0) {
            const { data: referrer } = await db.from('profiles').select('balance').eq('id', buyerProfile.referred_by).single();
            if (referrer) {
              const currentBalance = parseFloat(referrer.balance || '0');
              const newBalance = currentBalance + commission;
              await db.from('profiles').update({ balance: newBalance.toFixed(2) }).eq('id', buyerProfile.referred_by);
              alert(`✅ Order Completed!\n💰 Commission: ${commission.toFixed(2)} USDT added to the referrer's wallet.`);
            }
          }
        }
      }
    }
  }
  
  if(S.searchUser) {
     const { data: orders } = await db.from('orders').select('*').eq('user_id', S.searchUser.id).order('created_at', {ascending:false});
     S.searchOrders = orders || [];
  }
  await loadAll(); render();
}

async function viewShot(path){
  const { data, error } = await db.storage.from('screenshots').createSignedUrl(path,300);
  if(error){ alert(error.message); return; }
  window.open(data.signedUrl,'_blank');
}

boot();
